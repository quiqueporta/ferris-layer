[project]
name = "ferris-layer"
version = "0.1.0"
description = "Shows the active QMK layer of a Ferris Sweep keyboard in the GNOME top bar"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quique Porta" }]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ferris-layer = "ferris_layer.__main__:main"
ferris-via-backup = "ferris_layer.via_backup_cli:main"

[project.urls]
Homepage = "https://github.com/quiqueporta/ferris-layer"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ferris_layer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
